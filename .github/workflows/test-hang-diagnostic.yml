name: Test hang diagnostic

"on":
  push:
    branches: [ci/diagnose-test-hang]

permissions:
  contents: read

jobs:
  shard:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [9]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run test shard
        run: node --test --test-force-exit --test-shard=${{ matrix.shard }}/12 test/*.test.mjs
